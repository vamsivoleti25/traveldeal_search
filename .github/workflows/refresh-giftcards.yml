name: Refresh gift card discounts

# Weekly refresh of data/giftcards.json. Opens a pull request so you can review the
# changes before they reach the live site.
#
# OFF BY DEFAULT. To enable: Settings → Secrets and variables → Actions → Variables →
# New repository variable GIFTCARD_SOURCE = cardbear. Read the note at the top of
# scripts/refresh-giftcards.ts first.

on:
  schedule:
    - cron: '17 13 * * 1' # Mondays 13:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: ${{ vars.GIFTCARD_SOURCE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh snapshot
        env:
          GIFTCARD_SOURCE: ${{ vars.GIFTCARD_SOURCE }}
        run: npm run refresh:giftcards
      - name: Check the app still builds
        run: npm test && npm run build
      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/giftcard-refresh
          delete-branch: true
          add-paths: data/giftcards.json
          commit-message: 'Refresh gift card discount snapshot'
          title: 'Refresh gift card discounts'
          body-path: .giftcard-refresh-summary.md
          labels: data
