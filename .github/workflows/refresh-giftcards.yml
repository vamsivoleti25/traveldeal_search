name: Refresh gift card discounts

# Weekly refresh of data/giftcards.json, delivered as a pull request for you to review.
# OFF BY DEFAULT: add the repository variable GIFTCARD_SOURCE=cardbear to enable,
# after reading docs/DATA_SOURCES.md.

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: ${{ vars.GIFTCARD_SOURCE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Refresh snapshot
        env:
          GIFTCARD_SOURCE: ${{ vars.GIFTCARD_SOURCE }}
        run: python scripts/refresh_giftcards.py
      - run: pytest -q
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/giftcard-refresh
          delete-branch: true
          add-paths: data/giftcards.json
          commit-message: Refresh gift card discount snapshot
          title: Refresh gift card discounts
          body-path: .giftcard-refresh-summary.md
          labels: data
