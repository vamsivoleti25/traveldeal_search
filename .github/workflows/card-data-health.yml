name: Card data health

# Monthly: open or update one issue listing expired rotating categories,
# limited-time rates ending soon, and cards not re-verified in 180+ days.

on:
  schedule:
    - cron: "23 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/validate_data.py --report card-data-report.md
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "Nothing needs attention" card-data-report.md; then
            echo "Card data is healthy."; exit 0
          fi
          gh label create card-data --color FBCA04 --description "Card data needs review" 2>/dev/null || true
          number=$(gh issue list --label card-data --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file card-data-report.md
          else
            gh issue create --title "Card data needs review" --label card-data --body-file card-data-report.md
          fi
