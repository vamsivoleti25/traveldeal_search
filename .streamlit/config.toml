[server]
headless = true
port = 8501
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Deep evergreen + mint on soft white, serif display headings over a clean sans body.
# The rest of the look (hero bands, card tiles) is in app/theme.py.
[theme]
base = "light"
primaryColor = "#0b5a4a"
backgroundColor = "#f7f9f8"
secondaryBackgroundColor = "#eaf1ee"
textColor = "#0e211d"
borderColor = "#dbe5e1"
linkColor = "#0b5a4a"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap, serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
